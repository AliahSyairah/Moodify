name: moodify_real
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  http: ^1.2.0
  image_picker: ^1.0.7
  image_cropper: ^12.2.1
  permission_handler: ^12.0.3
  shared_preferences: ^2.2.3
  flutter_image_compress: ^2.3.0
  firebase_storage: ^13.4.1
  fl_chart: ^1.0.0
  provider: ^6.1.2
  webview_flutter: ^4.10.0
  audioplayers: ^6.0.0

  # AI / ML
  tflite_flutter: ^0.12.1
  image: ^4.1.7

  # utils
  html_unescape: ^2.0.0
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.0.0
  flutter_inappwebview: ^6.1.5
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# KORANG DIBAIKI: Jarak rapat ke kiri dan pilihan parameter dikemas kini dengan tepat
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  image_path_ios: "assets/images/logo.png"
  adaptive_icon_background: "#FFC000"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_foreground_resize_mode: "pad"

flutter:
  uses-material-design: true

  assets:
    - assets/models/emotion_fp16.tflite
    - assets/images/logo.png
    - assets/images/bg01.jpg
    - assets/images/auth_bgg.jpg
    - assets/images/login_top.jpg
    - assets/images/bg03.jpg
    - assets/images/happymoji.jpg
    - assets/images/sadmoji.jpg
    - assets/images/angrymoji.jpg
    - assets/images/neutralmoji.jpg
    - assets/audio/calm01.mp3
    - assets/audio/calm02.mp3
    - assets/audio/popup.mp3
    - assets/audio/shimmer.mp3
    - assets/images/neutral_mist.gif
    - assets/images/happy_confetti_texture.gif
    - assets/images/sad_rain_texture.gif
    - assets/images/angry_fire_texture.gif